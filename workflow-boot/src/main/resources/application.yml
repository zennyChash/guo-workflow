spring:
  application:
    name: guo-workflow-engine
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

flowable:
  async-executor-activate: false
  check-process-definitions: false
  database-schema-update: ${FLOWABLE_SCHEMA_UPDATE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

